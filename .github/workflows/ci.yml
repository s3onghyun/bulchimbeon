name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한: 코드 읽기만
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # 서드파티 Action 은 태그가 아닌 커밋 SHA 로 고정 (태그 변조 대비)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        # 정상은 2분 안팎. 테스트가 멈추면 작업 전체(20분)가 아니라 이 단계에서 끊는다 (2026-10-31 PR #63 실행)
        timeout-minutes: 10
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --strict --verbose=2 dist/Bulchimbeon.app

  # Linux daemon (Go). A separate job, so the macOS `test` check that branch protection
  # requires keeps its name; the owner may add this one to the required checks.
  go:
    name: go (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Test (includes the shared testdata/engine fixtures)
        run: go test ./...
      - name: Package (dry run)
        run: |
          ./scripts/package-linux.sh 0.0.0~ci amd64
          ./scripts/package-linux.sh 0.0.0~ci arm64
          dpkg-deb --info dist/linux/bulchimbeon_0.0.0~ci_amd64.deb
          tar -tzf dist/linux/bulchimbeon_0.0.0~ci_linux_arm64.tar.gz
