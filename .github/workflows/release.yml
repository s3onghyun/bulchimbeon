name: Release

# v* 태그 푸시 → universal 빌드 → 빌드 출처 증명(attestation) → GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write      # Release 생성
      id-token: write      # attestation 서명 (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Verify
        run: |
          codesign --verify --strict --verbose=2 dist/Bulchimbeon.app
          lipo -archs dist/Bulchimbeon.app/Contents/MacOS/Bulchimbeon
          cd dist && shasum -a 256 -c ./*.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "불침번 $GITHUB_REF_NAME" --generate-notes --verify-tag

  # Linux daemon: tar.gz, .deb and .rpm for amd64 and arm64, attached to the release above.
  # Plain `go build`, `dpkg-deb` (scripts/package-linux.sh) and `rpmbuild` from Ubuntu's own
  # `rpm` package (scripts/package-rpm.sh, repackaging the tarball's binary), no third-party packaging action.
  linux:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # Release 에 파일 추가
      id-token: write      # attestation 서명 (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Install rpmbuild
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends rpm
      - name: Build
        run: |
          for arch in amd64 arm64; do
            ./scripts/package-linux.sh "${GITHUB_REF_NAME#v}" "$arch"
            ./scripts/package-rpm.sh "${GITHUB_REF_NAME#v}" "$arch"
          done
          cd dist/linux && sha256sum ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS && cat SHA256SUMS
      - name: Verify
        run: |
          cd dist/linux
          sha256sum -c SHA256SUMS
          for deb in ./*.deb; do dpkg-deb --info "$deb"; done
          for rpm in ./*.rpm; do rpm -qip "$rpm" && rpm -qlp "$rpm"; done
          tar -xzOf "bulchimbeon_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" "bulchimbeon_${GITHUB_REF_NAME#v}_linux_amd64/bulchimbeon" > bulchimbeon
          chmod +x bulchimbeon && ./bulchimbeon version && rm bulchimbeon
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/linux/*.tar.gz dist/linux/*.deb dist/linux/*.rpm dist/linux/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
